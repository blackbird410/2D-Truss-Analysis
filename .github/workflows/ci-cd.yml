name: Cross-Platform Build and Release

on:
  push:
  #   branches: [ main, develop ]
  #   tags: [ 'v*' ]
  # pull_request:
  #   branches: [ main ]

env:
  CMAKE_VERSION: 3.20.0
  QT_VERSION: 6.5.0

jobs:
  # Build and test on multiple platforms
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            cmake_preset: linux-release
            artifact_name: TrussAnalysis-Linux
            package_format: deb
          - os: ubuntu-20.04
            name: linux-alt
            cmake_preset: linux-release
            artifact_name: TrussAnalysis-Linux-Ubuntu20
            package_format: deb
          - os: macos-13
            name: macos-intel
            cmake_preset: macos-release
            artifact_name: TrussAnalysis-macOS-Intel
            package_format: dmg
          - os: macos-14
            name: macos-arm
            cmake_preset: macos-release
            artifact_name: TrussAnalysis-macOS-ARM
            package_format: dmg
          - os: windows-2022
            name: windows
            cmake_preset: windows-release
            artifact_name: TrussAnalysis-Windows
            package_format: zip

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get version from tag
      shell: bash
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
        else
          VERSION=$(git describe --tags --abbrev=7 --always)
        fi
        echo "VERSION=$VERSION" >> $GITHUB_ENV
        echo "Building version: $VERSION"

    # Linux dependencies
    - name: Install Linux dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y \
          cmake \
          build-essential \
          pkg-config \
          qt6-base-dev \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          libeigen3-dev \
          ninja-build \
          desktop-file-utils \
          dpkg-dev \
          fakeroot \
          libgl1-mesa-dev \
          libxkbcommon-dev \
          libfontconfig1-dev \
          libfreetype6-dev \
          libx11-dev \
          libxext-dev \
          libxfixes-dev \
          libxi-dev \
          libxrender-dev \
          libxcb1-dev \
          libx11-xcb-dev \
          libxcb-glx0-dev

    # macOS dependencies
    - name: Install macOS dependencies
      if: runner.os == 'macOS'
      run: |
        brew install cmake qt@6 eigen ninja
        echo "$(brew --prefix qt@6)/bin" >> $GITHUB_PATH

    # Windows dependencies
    - name: Install Windows dependencies
      if: runner.os == 'Windows'
      run: |
        choco install cmake ninja
        # Qt6 will be installed via vcpkg

    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgDirectory: ${{ github.workspace }}/vcpkg
        vcpkgGitCommitId: 2024.04.26
        vcpkgJsonGlob: vcpkg.json

    - name: Clean build directory
      run: |
        rm -rf build
        mkdir -p build

    - name: Configure CMake (Linux/macOS)
      if: runner.os != 'Windows'
      run: |
        cmake -B build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=/usr/local \
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: |
        cmake -B build `
          -G Ninja `
          -DCMAKE_BUILD_TYPE=Release `
          -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

    - name: Build application
      run: cmake --build build --config Release --parallel

    - name: Run tests
      run: |
        cd build
        ctest --output-on-failure --parallel

    - name: Code signing (macOS)
      if: runner.os == 'macOS'
      run: |
        # Ad-hoc signing for CI/CD
        codesign --force --deep --sign - build/TrussAnalysisGUI.app
        codesign --force --sign - build/TrussAnalysisCLI

    - name: Create installer package (Linux)
      if: runner.os == 'Linux'
      run: |
        cd build
        make package
        # Create DEB package
        cpack -G DEB
        # Create AppImage (if tools available)
        if command -v linuxdeploy >/dev/null 2>&1; then
          mkdir -p AppDir/usr/bin
          cp TrussAnalysisGUI AppDir/usr/bin/
          cp TrussAnalysisCLI AppDir/usr/bin/
          linuxdeploy --appdir AppDir --output appimage
        fi

    - name: Create installer package (macOS)
      if: runner.os == 'macOS'
      run: |
        cd build
        make package

    - name: Create installer package (Windows)
      if: runner.os == 'Windows'
      run: |
        cd build
        cmake --build . --target package

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact_name }}
        path: |
          build/*.dmg
          build/*.deb
          build/*.rpm
          build/*.zip
          build/*.exe
          build/*.AppImage
        retention-days: 30

    - name: Upload to release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: |
          build/*.dmg
          build/*.deb
          build/*.rpm
          build/*.zip
          build/*.exe
          build/*.AppImage
        draft: false
        prerelease: contains(github.ref, 'beta') || contains(github.ref, 'alpha')
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Code quality checks
  code-quality:
    name: Code Quality
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          clang-format \
          clang-tidy \
          cppcheck \
          cmake \
          build-essential \
          qt6-base-dev \
          libeigen3-dev

    - name: Check code formatting
      run: |
        find src -name "*.cpp" -o -name "*.hpp" | xargs clang-format --dry-run --Werror || echo "Formatting check completed"

    - name: Run static analysis
      run: |
        rm -rf build
        cmake -B build -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
        find src -name "*.cpp" -exec clang-tidy {} -p build \; || echo "Static analysis completed"

    - name: Run cppcheck
      run: |
        cppcheck --enable=all --suppress=missingIncludeSystem --suppress=unmatchedSuppression src/ || echo "Cppcheck completed"

  # Security scanning
  security:
    name: Security Scan
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run CodeQL Analysis
      uses: github/codeql-action/init@v3
      with:
        languages: cpp

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3

  # Documentation generation
  documentation:
    name: Generate Documentation
    runs-on: ubuntu-22.04
    if: github.ref == 'refs/heads/main'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Doxygen
      run: |
        sudo apt update
        sudo apt install -y doxygen graphviz

    - name: Generate documentation
      run: |
        doxygen Doxyfile || echo "Doxygen config not found, skipping"

    - name: Deploy to GitHub Pages
      if: success()
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/html

  # Performance benchmarks
  benchmarks:
    name: Performance Benchmarks
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          cmake \
          build-essential \
          qt6-base-dev \
          libeigen3-dev \
          google-benchmark-dev

    - name: Build with benchmarks
      run: |
        rm -rf build
        cmake -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_BENCHMARKS=ON
        cmake --build build --parallel

    - name: Run benchmarks
      run: |
        cd build
        ./benchmarks --benchmark_format=json > benchmark_results.json

    - name: Comment benchmark results
      uses: benchmark-action/github-action-benchmark@v1
      with:
        tool: 'googlecpp'
        output-file-path: build/benchmark_results.json
        github-token: ${{ secrets.GITHUB_TOKEN }}
        comment-on-alert: true
