# Static Analysis Workflow
# Comprehensive code quality checks: clang-tidy, cppcheck, format verification
# Enforces coding standards and detects potential issues

name: Static Analysis

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ============================================================================
  # Code Formatting Check
  # ============================================================================

  format-check:
    name: Format Verification
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14

      - name: Check code formatting
        id: format-check
        run: |
          if CLANG_FORMAT_BIN=clang-format-14 ./scripts/format-code.sh --check; then
            echo "status=pass" >> $GITHUB_OUTPUT
          else
            echo "status=fail" >> $GITHUB_OUTPUT
          fi

      - name: Apply formatting if needed
        if: steps.format-check.outputs.status == 'fail'
        run: |
          echo "Applying code formatting fixes..."
          CLANG_FORMAT_BIN=clang-format-14 ./scripts/format-code.sh --apply

          # Check if there were actual changes
          if git diff --quiet; then
            echo "No changes after formatting"
            exit 0
          fi

          # Show what changed
          echo "## Formatting Changes Applied" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "The following files were reformatted:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git diff --name-only >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** These formatting changes have been automatically applied." >> $GITHUB_STEP_SUMMARY
          echo "Please pull the latest changes." >> $GITHUB_STEP_SUMMARY

      - name: Generate formatting diff (if applied)
        if: steps.format-check.outputs.status == 'fail' && !cancelled()
        run: |
          if ! git diff --quiet; then
            echo "⚠️ Formatting changes applied automatically."
            echo ""
            echo "Modified files:"
            git diff --name-only
            echo ""
            echo "These changes have been committed. Please pull the latest changes."
          fi

  # ============================================================================
  # clang-tidy Analysis
  # ============================================================================

  clang-tidy:
    name: clang-tidy Analysis
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            clang-tidy-14 \
            pkg-config \
            curl \
            zip \
            unzip \
            tar \
            git \
            autoconf \
            automake \
            autoconf-archive \
            bison \
            flex \
            gperf \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrender-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxcb-cursor-dev \
            libxcb-util-dev \
            libdbus-1-dev \
            libatspi2.0-dev

      - name: Setup vcpkg
        run: |
          if [ ! -d "${GITHUB_WORKSPACE}/vcpkg" ]; then
            git clone https://github.com/microsoft/vcpkg.git "${GITHUB_WORKSPACE}/vcpkg"
            "${GITHUB_WORKSPACE}/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_INSTALLATION_ROOT=${GITHUB_WORKSPACE}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_OVERLAY_TRIPLETS=${GITHUB_WORKSPACE}/vcpkg-triplets" >> $GITHUB_ENV
          echo "VCPKG_DEFAULT_TRIPLET=x64-linux-pch-off" >> $GITHUB_ENV
          echo "${GITHUB_WORKSPACE}/vcpkg" >> $GITHUB_PATH

      - name: Cache vcpkg
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg
            vcpkg/buildtrees
            vcpkg/packages
            vcpkg/downloads
            build/vcpkg_installed
          key: vcpkg-analysis-${{ runner.os }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            vcpkg-analysis-${{ runner.os }}-

      - name: Set vcpkg environment
        run: |
          echo "VCPKG_MAX_CONCURRENCY=2" >> $GITHUB_ENV
          echo "VCPKG_KEEP_ENV_VARS=ACTIONS_CACHE_URL;ACTIONS_RUNTIME_TOKEN" >> $GITHUB_ENV

      - name: Configure CMake (for compile_commands.json)
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=OFF \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake

      - name: Run clang-tidy
        run: |
          echo "Running clang-tidy analysis..."

          # Create output directory
          mkdir -p build/static-analysis

          # Find all source files (exclude tests, external, and generated code)
          FILES=$(find src -type f \( -name "*.cpp" \) \
            ! -path "*/vcpkg_installed/*" \
            ! -path "*/build/*" \
            ! -path "*/external/*" \
            ! -name "*_autogen*" \
            ! -name "moc_*" \
            ! -name "qrc_*")

          # Run clang-tidy
          TIDY_FAILED=0
          for file in $FILES; do
            echo "Analyzing $file..."
            if ! clang-tidy-14 -p build "$file" 2>&1 | tee -a build/static-analysis/clang-tidy.log; then
              TIDY_FAILED=1
            fi
          done

          # Check for errors
          if grep -q "error:" build/static-analysis/clang-tidy.log; then
            echo "::error::clang-tidy found errors"
            TIDY_FAILED=1
          fi

          # Count warnings
          WARNING_COUNT=$(grep -c "warning:" build/static-analysis/clang-tidy.log || echo "0")
          echo "clang-tidy warnings: $WARNING_COUNT"

          if [ $TIDY_FAILED -eq 1 ]; then
            exit 1
          fi

          echo "✅ clang-tidy analysis completed"

      - name: Upload clang-tidy results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-results
          path: build/static-analysis/clang-tidy.log
          retention-days: 30

      - name: Generate clang-tidy summary
        if: always()
        run: |
          echo "## clang-tidy Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f build/static-analysis/clang-tidy.log ]; then
            ERROR_COUNT=$(grep -c "error:" build/static-analysis/clang-tidy.log || echo "0")
            WARNING_COUNT=$(grep -c "warning:" build/static-analysis/clang-tidy.log || echo "0")
            
            echo "- ❌ Errors: $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️  Warnings: $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "### Errors Found" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              grep "error:" build/static-analysis/clang-tidy.log | head -20 >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "_No analysis results available_" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # cppcheck Analysis
  # ============================================================================

  cppcheck:
    name: cppcheck Analysis
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          echo "Running cppcheck analysis..."

          mkdir -p build/static-analysis

          # Run cppcheck with comprehensive checks
          cppcheck \
            --enable=all \
            --inconclusive \
            --std=c++20 \
            --language=c++ \
            --platform=unix64 \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=unusedFunction \
            --inline-suppr \
            --xml \
            --xml-version=2 \
            -I include \
            -I src \
            -D Q_OBJECT \
            -D Q_SIGNALS \
            -D Q_SLOTS \
            -D Q_OVERRIDE \
            -D Q_PROPERTY \
            --suppress=*:src/gui/PlotWidget_corrupted.cpp \
            src/ include/ \
            2> build/static-analysis/cppcheck-report.xml || true

          # Convert XML to text for summary
          cppcheck \
            --enable=all \
            --inconclusive \
            --std=c++20 \
            --language=c++ \
            --suppress=missingIncludeSystem \
            --suppress=unmatchedSuppression \
            --suppress=unusedFunction \
            --inline-suppr \
            -I include \
            -I src \
            -D Q_OBJECT \
            -D Q_SIGNALS \
            -D Q_SLOTS \
            -D Q_OVERRIDE \
            -D Q_PROPERTY \
            --suppress=*:src/gui/PlotWidget_corrupted.cpp \
            src/ include/ \
            2>&1 | tee build/static-analysis/cppcheck.log || true

          echo "✅ cppcheck analysis completed"

      - name: Check for critical issues
        run: |
          if [ -f build/static-analysis/cppcheck-report.xml ]; then
            # Check for errors (severity error)
            ERROR_COUNT=$(grep -c 'severity="error"' build/static-analysis/cppcheck-report.xml || echo "0")
            
            if [ "$ERROR_COUNT" -gt 0 ]; then
              echo "::error::cppcheck found $ERROR_COUNT error(s)"
              echo "Review build/static-analysis/cppcheck-report.xml for details"
              # Uncomment to enforce zero errors:
              # exit 1
            fi
            
            echo "cppcheck errors: $ERROR_COUNT"
          fi

      - name: Upload cppcheck results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cppcheck-results
          path: |
            build/static-analysis/cppcheck-report.xml
            build/static-analysis/cppcheck.log
          retention-days: 30

      - name: Generate cppcheck summary
        if: always()
        run: |
          echo "## cppcheck Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f build/static-analysis/cppcheck-report.xml ]; then
            ERROR_COUNT=$(grep -c 'severity="error"' build/static-analysis/cppcheck-report.xml || echo "0")
            WARNING_COUNT=$(grep -c 'severity="warning"' build/static-analysis/cppcheck-report.xml || echo "0")
            STYLE_COUNT=$(grep -c 'severity="style"' build/static-analysis/cppcheck-report.xml || echo "0")
            PERFORMANCE_COUNT=$(grep -c 'severity="performance"' build/static-analysis/cppcheck-report.xml || echo "0")
            
            echo "- ❌ Errors: $ERROR_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- ⚠️  Warnings: $WARNING_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- 📝 Style: $STYLE_COUNT" >> $GITHUB_STEP_SUMMARY
            echo "- ⚡ Performance: $PERFORMANCE_COUNT" >> $GITHUB_STEP_SUMMARY
          else
            echo "_No analysis results available_" >> $GITHUB_STEP_SUMMARY
          fi

  # ============================================================================
  # Analysis Summary
  # ============================================================================

  analysis-summary:
    name: Analysis Summary
    runs-on: ubuntu-22.04
    needs: [format-check, clang-tidy, cppcheck]
    if: always()

    steps:
      - name: Check analysis status
        run: |
          FORMAT_STATUS="${{ needs.format-check.result }}"
          TIDY_STATUS="${{ needs.clang-tidy.result }}"
          CPPCHECK_STATUS="${{ needs.cppcheck.result }}"

          echo "## Static Analysis Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY

          # Format check
          if [ "$FORMAT_STATUS" == "success" ]; then
            echo "| Code Format | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| Code Format | ⚠️  Auto-Fixed |" >> $GITHUB_STEP_SUMMARY
          fi

          # clang-tidy
          if [ "$TIDY_STATUS" == "success" ]; then
            echo "| clang-tidy | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| clang-tidy | ⚠️  Issues Found |" >> $GITHUB_STEP_SUMMARY
          fi

          # cppcheck
          if [ "$CPPCHECK_STATUS" == "success" ]; then
            echo "| cppcheck | ✅ Passed |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| cppcheck | ⚠️  Issues Found |" >> $GITHUB_STEP_SUMMARY
          fi

          # Hard fail only on clang-tidy (errors) or cppcheck
          if [ "$TIDY_STATUS" != "success" ] || [ "$CPPCHECK_STATUS" != "success" ]; then
            echo ""
            echo "::error::Static analysis found issues (clang-tidy or cppcheck)"
            exit 1
          fi

          echo ""
          echo "✅ Static analysis completed"
