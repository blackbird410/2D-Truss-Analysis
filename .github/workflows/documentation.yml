name: Documentation

# ==============================================================================
# Triggers
# ==============================================================================

on:
  push:
    branches:
      - main
      # - develop
    paths:
      - "src/**"
      - "include/**"
      - "Doxyfile.in"
      - "CMakeLists.txt"
      - ".github/workflows/documentation.yml"
      - "README.md"
      - "CONTRIBUTING.md"
  workflow_dispatch:
    inputs:
      deploy_pages:
        description: "Deploy to GitHub Pages"
        required: false
        default: false
        type: boolean

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

# ==============================================================================
# Permissions
# ==============================================================================

permissions:
  contents: write

# Ensure only one deployment runs at a time
concurrency:
  group: "docs-workflow"
  cancel-in-progress: false

# ==============================================================================
# Jobs
# ==============================================================================

jobs:
  build-documentation:
    name: Build Doxygen Documentation
    runs-on: ubuntu-latest
    concurrency:
      group: gh-pages-content
      cancel-in-progress: false

    steps:
      # ----------------------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for accurate git metadata

      # ----------------------------------------------------------------------
      # Install Dependencies
      # ----------------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            pkg-config \
            doxygen \
            graphviz \
            qt6-base-dev \
            qt6-svg-dev

          cmake --version
          doxygen --version
          dot -V

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: "01f602195983451bc83e72f4214af2cbc495aa94"
          vcpkgJsonGlob: "**/vcpkg.json"

      - name: Set VCPKG_ROOT
        run: |
          echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/vcpkg" >> "$GITHUB_ENV"

      # ----------------------------------------------------------------------
      # Configure Project (to generate Doxyfile)
      # ----------------------------------------------------------------------
      - name: Configure CMake
        run: |
          TOOLCHAIN_ARG=""
          if [ -f "${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake" ]; then
            TOOLCHAIN_ARG="-DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"
          fi

          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=OFF \
            -DBUILD_GUI=OFF \
            ${TOOLCHAIN_ARG}

      # ----------------------------------------------------------------------
      # Generate Documentation
      # ----------------------------------------------------------------------
      - name: Generate Doxygen Documentation
        run: |
          cd build
          cmake --build . --target docs

      # ----------------------------------------------------------------------
      # Validate Documentation
      # ----------------------------------------------------------------------
      - name: Check for undocumented APIs
        run: |
          if [ -f build/doxygen_warnings.log ]; then
            echo "::warning::Doxygen warnings found:"
            cat build/doxygen_warnings.log

            # Count critical warnings (undocumented members/classes)
            CRITICAL_WARNINGS=$(grep -c "not documented" build/doxygen_warnings.log || true)

            if [ "$CRITICAL_WARNINGS" -gt 0 ]; then
              echo "::error::Found $CRITICAL_WARNINGS undocumented API(s)"
              echo "Please document all public APIs before merging"
              # Uncomment to enforce zero undocumented APIs:
              # exit 1
            fi
          else
            echo "No Doxygen warnings file found - documentation generated successfully"
          fi

      - name: Verify HTML output
        run: |
          if [ ! -f build/docs/api/html/index.html ]; then
            echo "::error::Documentation index.html not found!"
            exit 1
          fi

          echo "Documentation generated successfully:"
          echo "  - HTML files: $(find build/docs/api/html -name "*.html" | wc -l)"
          echo "  - Total size: $(du -sh build/docs/api/html | cut -f1)"

          # Check for broken links (basic check)
          if command -v linkchecker &> /dev/null; then
            linkchecker --check-extern build/docs/api/html/index.html || true
          fi

      # ----------------------------------------------------------------------
      # Upload Artifacts
      # ----------------------------------------------------------------------
      - name: Upload documentation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doxygen-documentation
          path: build/docs/api/html/
          retention-days: 90
          if-no-files-found: error

      - name: Checkout gh-pages branch
        if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_pages == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 0

      - name: Publish docs to gh-pages/docs
        if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_pages == 'true'
        run: |
          mkdir -p gh-pages/docs
          rsync -a --delete build/docs/api/html/ gh-pages/docs/

      - name: Commit and push docs updates
        if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_pages == 'true'
        run: |
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/

          if git diff --cached --quiet; then
            echo "No documentation changes to commit"
            exit 0
          fi

          git commit -m "docs: publish API documentation from ${GITHUB_SHA}"

          for attempt in 1 2 3; do
            git pull --rebase origin gh-pages
            if git push origin gh-pages; then
              exit 0
            fi
            echo "Push failed on attempt ${attempt}; retrying..."
            sleep 2
          done

          echo "Failed to push documentation updates after retries" >&2
          exit 1

      - name: Publish docs URL
        if: github.ref == 'refs/heads/main' || github.event.inputs.deploy_pages == 'true'
        run: |
          echo "Documentation available at: https://blackbird410.github.io/2D-Truss-Analysis/docs/"
          echo "APT repository expected at: https://blackbird410.github.io/2D-Truss-Analysis/apt/"

  # ============================================================================
  # Documentation Quality Check (Optional - for strict enforcement)
  # ============================================================================

  quality-check:
    name: Documentation Quality Check
    runs-on: ubuntu-22.04
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for TODOs in public headers
        run: |
          TODO_COUNT=$(grep -r "TODO\|FIXME\|XXX" include/ --include="*.hpp" --include="*.h" || true)
          if [ -n "$TODO_COUNT" ]; then
            echo "::warning::Found TODOs in public headers:"
            echo "$TODO_COUNT"
          fi

      - name: Check for missing @brief tags
        run: |
          # Check that all public classes/functions have @brief
          MISSING_BRIEF=$(grep -r "^class\|^struct" include/ --include="*.hpp" --include="*.h" | \
                          while read line; do
                            file=$(echo "$line" | cut -d: -f1)
                            # Check if @brief exists in preceding 5 lines
                            if ! grep -B5 "$line" "$file" | grep -q "@brief\|///" ; then
                              echo "$line"
                            fi
                          done || true)

          if [ -n "$MISSING_BRIEF" ]; then
            echo "::warning::Classes/structs without @brief documentation:"
            echo "$MISSING_BRIEF"
          fi
