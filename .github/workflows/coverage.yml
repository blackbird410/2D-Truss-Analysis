# Code Coverage Workflow
# Generates comprehensive code coverage reports and enforces coverage thresholds
# Uploads results to Codecov for tracking and visualization
#
# STATUS: TEMPORARILY DISABLED FOR AUTOMATIC EXECUTION
# This workflow uses vcpkg which has been experiencing resource exhaustion issues on GitHub Actions runners.
#
# Current trigger strategy:
# - Manual dispatch only via GitHub Actions UI (Workflow Dispatch)
# - Scheduled weekly runs continue for CI metrics
#
# Re-enablement Instructions (when vcpkg stability confirmed):
# 1. Uncomment push and pull_request triggers below
# 2. Monitor runner resource usage for 3-5 consecutive runs
# 3. Verify disk cleanup effectiveness and binary cache hit rates
# 4. Ensure no "runner lost communication" or "no space left" errors
#
# TO RE-ENABLE: Uncomment the 'on:' section below with push/pull_request triggers

name: Code Coverage

on:
  # DISABLED: push:
  #   branches: [main, develop]
  # DISABLED: pull_request:
  #   branches: [main, develop]
  workflow_dispatch:
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: "0 0 * * 1"

env:
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_MAX_CONCURRENCY: "1"
  VCPKG_KEEP_ENV_VARS: "ACTIONS_CACHE_URL;ACTIONS_RUNTIME_TOKEN"
  CMAKE_BUILD_PARALLEL_LEVEL: "2"

jobs:
  # ============================================================================
  # Coverage Analysis
  # ============================================================================

  coverage:
    name: Generate Coverage Report
    runs-on: ubuntu-22.04

    env:
      # Only build debug configuration for coverage (no need for release)
      VCPKG_BUILD_TYPE: debug

    steps:
      # ----------------------------------------------------------------------
      # Checkout and Setup
      # ----------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Disk usage (pre-clean)
        run: df -h

      - name: Free disk space
        run: |
          echo "Removing unnecessary preinstalled software..."
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker system prune -af || true
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /tmp/*

      - name: Disk usage (post-clean)
        run: df -h

      - name: Export GitHub Actions cache variables
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      # ----------------------------------------------------------------------
      # Install Dependencies
      # ----------------------------------------------------------------------
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            build-essential \
            lcov \
            gcovr \
            pkg-config \
            curl \
            zip \
            unzip \
            tar \
            git \
            autoconf \
            automake \
            autoconf-archive \
            bison \
            flex \
            gperf \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libx11-dev \
            libxext-dev \
            libxfixes-dev \
            libxi-dev \
            libxrender-dev \
            libxcb1-dev \
            libx11-xcb-dev \
            libxcb-glx0-dev \
            libxcb-icccm4-dev \
            libxcb-image0-dev \
            libxcb-keysyms1-dev \
            libxcb-randr0-dev \
            libxcb-render-util0-dev \
            libxcb-shape0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-xinerama0-dev \
            libxcb-xkb-dev \
            libxcb-cursor-dev \
            libxcb-util-dev \
            libdbus-1-dev \
            libatspi2.0-dev \
            xvfb

      - name: Verify coverage tools
        run: |
          lcov --version
          gcovr --version
          gcov --version

      - name: Setup vcpkg (manifest + binary cache)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgDirectory: ${{ github.workspace }}/vcpkg
          vcpkgGitCommitId: "01f602195983451bc83e72f4214af2cbc495aa94"
          vcpkgJsonGlob: "**/vcpkg.json"

      - name: Set vcpkg environment
        run: |
          echo "VCPKG_ROOT=${GITHUB_WORKSPACE}/vcpkg" >> $GITHUB_ENV
          echo "VCPKG_INSTALLATION_ROOT=${GITHUB_WORKSPACE}/vcpkg" >> $GITHUB_ENV
          echo "${GITHUB_WORKSPACE}/vcpkg" >> $GITHUB_PATH

      - name: Disk usage (post-vcpkg)
        run: df -h

      # ----------------------------------------------------------------------
      # Build with Coverage
      # ----------------------------------------------------------------------
      - name: Clean build directory
        run: |
          rm -rf build
          mkdir -p build

      - name: Configure CMake with coverage enabled
        run: |
          cmake -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DBUILD_TESTING=ON \
            -DENABLE_COVERAGE=ON \
            -DCMAKE_CXX_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_C_FLAGS="--coverage -fprofile-arcs -ftest-coverage" \
            -DCMAKE_EXE_LINKER_FLAGS="--coverage" \
            -DCMAKE_TOOLCHAIN_FILE=${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake

      - name: Verify coverage flags
        run: |
          if ! grep -q "ENABLE_COVERAGE:BOOL=ON" build/CMakeCache.txt; then
            echo "::warning::ENABLE_COVERAGE is not set in CMake cache"
          fi
          echo "✓ Coverage configuration verified"

      - name: Build with coverage instrumentation
        run: |
          cmake --build build --parallel 2

      # ----------------------------------------------------------------------
      # Run Tests to Generate Coverage Data
      # ----------------------------------------------------------------------
      - name: Initialize coverage counters
        run: |
          cd build
          lcov --zerocounters --directory .
          lcov --capture --initial --directory . --output-file coverage_base.info --rc branch_coverage=1 || true

      - name: Run all tests
        run: |
          cd build
          xvfb-run -a ctest --output-on-failure --parallel $(nproc) || echo "Some tests failed, but continuing with coverage"

      # ----------------------------------------------------------------------
      # Generate Coverage Reports
      # ----------------------------------------------------------------------
      - name: Capture coverage data
        run: |
          cd build

          echo "Capturing coverage data..."
          lcov --capture \
               --directory . \
               --output-file coverage.info \
               --rc branch_coverage=1 \
               --ignore-errors inconsistent,format,gcov,mismatch,negative || true

          echo "Filtering coverage data..."
          lcov --remove coverage.info \
               '/usr/*' \
               '*/build/*' \
               '*/tests/*' \
               '*/external/*' \
               '*/vcpkg_installed/*' \
               '*/v1/*' \
               '*_autogen/*' \
               '*/moc_*' \
               '*/qrc_*' \
               --output-file coverage_filtered.info \
               --rc branch_coverage=1 \
               --ignore-errors inconsistent,format,gcov,unused,mismatch,negative || true

          echo "Coverage data captured and filtered"

      - name: Generate HTML coverage report
        run: |
          cd build

          genhtml coverage_filtered.info \
                  --output-directory coverage_html \
                  --title "2D Truss Analysis - Code Coverage" \
                  --num-spaces 4 \
                  --legend \
                  --show-details \
                  --rc branch_coverage=1 \
                  --ignore-errors inconsistent,category,mismatch,negative || true

          echo "✅ HTML coverage report generated"

      - name: Generate coverage summary
        run: |
          cd build

          # Generate text summary
          lcov --list coverage_filtered.info \
               --rc branch_coverage=1 \
               | tee coverage_summary.txt || true

          # Extract coverage percentage
          COVERAGE=$(lcov --summary coverage_filtered.info 2>&1 | grep "lines" | awk '{print $2}' | sed 's/%//' || echo "0")
          echo "COVERAGE_PERCENT=$COVERAGE" >> $GITHUB_ENV

          echo "Overall line coverage: ${COVERAGE}%"

      # ----------------------------------------------------------------------
      # Upload Coverage Reports
      # ----------------------------------------------------------------------
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: build/coverage_filtered.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-html
          path: build/coverage_html/
          retention-days: 30

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: coverage-data
          path: |
            build/coverage_filtered.info
            build/coverage_summary.txt
          retention-days: 30

      # ----------------------------------------------------------------------
      # Coverage Quality Gates
      # ----------------------------------------------------------------------
      - name: Check coverage thresholds
        run: |
          cd build

          if [ -f coverage_filtered.info ]; then
            # Extract line coverage percentage
            COVERAGE=$(lcov --summary coverage_filtered.info 2>&1 | grep "lines" | awk '{print $2}' | sed 's/%//' || echo "0")
            
            echo "## Coverage Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Line Coverage:** ${COVERAGE}%" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # Define threshold (adjust as needed)
            THRESHOLD=70
            
            if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
              echo "⚠️  Warning: Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%" >> $GITHUB_STEP_SUMMARY
              echo "::warning::Coverage ${COVERAGE}% is below threshold ${THRESHOLD}%"
              # Uncomment to enforce coverage threshold:
              # exit 1
            else
              echo "✅ Coverage ${COVERAGE}% meets threshold ${THRESHOLD}%" >> $GITHUB_STEP_SUMMARY
            fi
            
            # Generate detailed summary
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Coverage by Directory" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            lcov --list coverage_filtered.info --rc branch_coverage=1 2>/dev/null | head -30 >> $GITHUB_STEP_SUMMARY || true
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "::error::Coverage data file not found"
            exit 1
          fi

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const coverage = process.env.COVERAGE_PERCENT;

            const comment = `## 📊 Code Coverage Report

            **Line Coverage:** ${coverage}%

            - 🔗 [View detailed HTML report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            - 📈 [Codecov Report](https://codecov.io/gh/${{ github.repository }})

            ${coverage >= 70 ? '✅ Coverage meets threshold (70%)' : '⚠️  Coverage below threshold (70%)'}
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  # ============================================================================
  # Coverage Trend Analysis (Optional)
  # ============================================================================

  coverage-trend:
    name: Coverage Trend
    runs-on: ubuntu-22.04
    needs: coverage
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download coverage data
        uses: actions/download-artifact@v4
        with:
          name: coverage-data
          path: build/

      - name: Track coverage trend
        run: |
          echo "## Coverage Trend Tracking" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Coverage data archived for trend analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Run ID: ${{ github.run_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage: ${{ env.COVERAGE_PERCENT }}%" >> $GITHUB_STEP_SUMMARY
