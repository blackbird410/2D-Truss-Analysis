<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="background" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2E3440;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B4252;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" fill="url(#background)" rx="16"/>

  <!-- Truss structure -->
  <g stroke="#88C0D0" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Main base -->
    <line x1="16" y1="96" x2="112" y2="96"/>
    <!-- Main triangle -->
    <line x1="16" y1="96" x2="64" y2="32"/>
    <line x1="112" y1="96" x2="64" y2="32"/>
    <!-- Internal members -->
    <line x1="40" y1="80" x2="64" y2="32"/>
    <line x1="88" y1="80" x2="64" y2="32"/>
    <line x1="40" y1="80" x2="88" y2="80"/>
    <!-- Additional cross members -->
    <line x1="40" y1="80" x2="64" y2="64"/>
    <line x1="88" y1="80" x2="64" y2="64"/>
  </g>

  <!-- Support symbols -->
  <g fill="#BF616A">
    <!-- Left support (pinned) -->
    <rect x="12" y="96" width="8" height="16"/>
    <polygon points="12,112 20,112 16,120"/>
    <!-- Right support (roller) -->
    <rect x="108" y="96" width="8" height="16"/>
    <circle cx="112" cy="116" r="3"/>
  </g>

  <!-- Nodes -->
  <g fill="#ECEFF4" stroke="#2E3440" stroke-width="2">
    <circle cx="16" cy="96" r="4"/>
    <circle cx="112" cy="96" r="4"/>
    <circle cx="64" cy="32" r="4"/>
    <circle cx="40" cy="80" r="4"/>
    <circle cx="88" cy="80" r="4"/>
    <circle cx="64" cy="64" r="4"/>
  </g>

  <!-- Load arrow -->
  <g stroke="#D08770" stroke-width="2" fill="#D08770">
    <line x1="64" y1="16" x2="64" y2="28"/>
    <polygon points="64,16 60,20 68,20"/>
  </g>

  <!-- Text label -->
  <text x="64" y="110" text-anchor="middle" fill="#ECEFF4" font-family="monospace" font-size="12" font-weight="bold">TRUSS</text>
</svg>
