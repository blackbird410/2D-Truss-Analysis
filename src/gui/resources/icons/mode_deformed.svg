<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Deformed shape mode: ghost (dashed) original + solid displaced overlay -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Ghost original (dashed, dimmed) -->
    <g stroke="currentColor" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.45">
      <line x1="3" y1="19" x2="12" y2="5"/>
      <line x1="12" y1="5" x2="21" y2="19"/>
      <line x1="3" y1="19" x2="21" y2="19"/>
    </g>
    <!-- Deformed (solid, brighter, slightly shifted) -->
    <g stroke="#4fc3f7" stroke-width="1.8">
      <line x1="3" y1="19" x2="13" y2="7"/>
      <line x1="13" y1="7" x2="21" y2="18"/>
      <line x1="3" y1="19" x2="21" y2="18"/>
    </g>
    <circle cx="3"  cy="19" r="1.5" fill="currentColor" stroke="none"/>
    <circle cx="13" cy="7"  r="1.5" fill="#4fc3f7" stroke="none"/>
    <circle cx="21" cy="18" r="1.5" fill="#4fc3f7" stroke="none"/>
  </g>
</svg>
