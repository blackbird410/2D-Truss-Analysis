<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16">
  <!-- Outer window frame -->
  <rect x="2" y="4" width="9" height="9" rx="1"
        fill="none" stroke="currentColor" stroke-width="1.4"/>
  <!-- Inner offset square (pop-out badge) -->
  <rect x="6" y="2" width="8" height="8" rx="1"
        fill="none" stroke="currentColor" stroke-width="1.4"/>
  <!-- White fill to occlude overlap -->
  <rect x="7" y="3" width="6" height="6" fill="currentColor" opacity="0"/>
</svg>
