app-id: com.civilengsoft.TrussAnalysis
runtime: org.kde.Platform
runtime-version: '6.5'
sdk: org.kde.Sdk
command: TrussAnalysisGUI
finish-args:
  # X11 + XShm access
  - --share=ipc
  - --socket=x11
  # Wayland access
  - --socket=wayland
  # File system access for project files
  - --filesystem=home
  - --filesystem=xdg-documents
  # Network access (for updates, help)
  - --share=network
  # OpenGL access
  - --device=dri

modules:
  - name: eigen3
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: archive
        url: https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.bz2
        sha256: b4c198460eba6f28d34894e3a5710998818515104d6e74e5cc331ce31e46e626

  - name: truss-analysis
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_INSTALL_PREFIX=/app
    post-install:
      # Install desktop file
      - install -Dm644 flatpak/com.civilengsoft.TrussAnalysis.desktop /app/share/applications/com.civilengsoft.TrussAnalysis.desktop
      # Install icon
      - install -Dm644 flatpak/com.civilengsoft.TrussAnalysis.svg /app/share/icons/hicolor/scalable/apps/com.civilengsoft.TrussAnalysis.svg
      # Install metainfo
      - install -Dm644 flatpak/com.civilengsoft.TrussAnalysis.metainfo.xml /app/share/metainfo/com.civilengsoft.TrussAnalysis.metainfo.xml
    sources:
      - type: git
        url: https://github.com/blackbird410/2D-Truss-Analysis-cpp.git
        tag: v2.2.0
